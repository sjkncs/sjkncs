# SJKNCS 版本一致性检查

name: Version Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version.json validity
        run: |
          python3 -c "
          import json, sys
          try:
              data = json.load(open('version.json'))
              assert 'version' in data, 'Missing version field'
              assert 'skills' in data, 'Missing skills field'
              assert 'changelog' in data, 'Missing changelog field'
              # Check all skills have version
              for name, skill in data['skills'].items():
                  assert 'version' in skill, f'Skill {name} missing version'
              print('✅ version.json is valid')
              print(f'   Version: {data[\"version\"]}')
              print(f'   Skills: {len(data[\"skills\"])}')
          except Exception as e:
              print(f'❌ version.json error: {e}')
              sys.exit(1)
          "

      - name: Check all SKILL.md files exist
        run: |
          MISSING=0
          for skill in 01-code-optimization 02-rule-management 03-memory-context 04-rollback-backup 05-file-classification 06-token-saving 07-sync-management; do
            if [ -f ".codebuddy/skills/$skill/SKILL.md" ]; then
              echo "✅ .codebuddy/skills/$skill/SKILL.md"
            else
              echo "❌ .codebuddy/skills/$skill/SKILL.md MISSING"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "Some SKILL.md files are missing!"
            exit 1
          fi

      - name: Check README exists
        run: |
          if [ -f "README.md" ]; then
            echo "✅ README.md"
          else
            echo "❌ README.md MISSING"
            exit 1
          fi
